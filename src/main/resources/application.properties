spring.application.name=payment-service

server.port = 8054

spring.datasource.url = jdbc:mysql://localhost:3306/ecompaymentms?createDatabaseIfNotExist = true
spring.datasource.username = root
spring.datasource.password = rules

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

logging.level.com.netflix.eureka=off
logging.level.com.netflix.discovery=off

# Actuator
management.endpoints.web.exposure.include= *

# CircuitBreaker Pattern
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.instances.userServiceDB.sliding-window-size=6
resilience4j.circuitbreaker.instances.userServiceDB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userServiceDB.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.userServiceDB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userServiceDB.automatic-transition-from-open-to-half-open-enabled=true
